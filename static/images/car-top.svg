<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 120" width="100%" height="100%">
  <defs>
    <linearGradient id="carBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="windshieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="carShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  
  <!-- Outer Shadow & Chassis -->
  <g filter="url(#carShadow)">
    <!-- Wheels -->
    <rect x="3" y="16" width="6" height="18" rx="3" fill="#0f172a"/>
    <rect x="51" y="16" width="6" height="18" rx="3" fill="#0f172a"/>
    <rect x="3" y="86" width="6" height="18" rx="3" fill="#0f172a"/>
    <rect x="51" y="86" width="6" height="18" rx="3" fill="#0f172a"/>
    
    <!-- Main Body Shape -->
    <path d="M 12 14 C 12 6, 48 6, 48 14 L 50 36 C 52 48, 52 72, 50 84 L 48 106 C 48 114, 12 114, 12 106 L 10 84 C 8 72, 8 48, 10 36 Z" 
          fill="url(#carBodyGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
          
    <!-- Side Mirrors -->
    <path d="M 7 34 C 4 34, 4 40, 8 42 Z" fill="#94a3b8"/>
    <path d="M 53 34 C 56 34, 56 40, 52 42 Z" fill="#94a3b8"/>

    <!-- Front Windshield -->
    <path d="M 14 34 C 18 31, 42 31, 46 34 L 44 48 C 38 46, 22 46, 16 48 Z" fill="url(#windshieldGrad)"/>

    <!-- Panoramic Roof -->
    <rect x="16" y="52" width="28" height="24" rx="4" fill="#0f172a" opacity="0.85"/>
    
    <!-- Rear Windshield -->
    <path d="M 16 82 C 22 84, 38 84, 44 82 L 46 94 C 42 97, 18 97, 14 94 Z" fill="url(#windshieldGrad)"/>

    <!-- Headlights -->
    <path d="M 13 8 L 18 10 L 16 14 L 11 11 Z" fill="#38bdf8"/>
    <path d="M 47 8 L 42 10 L 44 14 L 49 11 Z" fill="#38bdf8"/>

    <!-- Taillights -->
    <path d="M 13 112 L 20 110 L 19 107 L 12 109 Z" fill="#ef4444"/>
    <path d="M 47 112 L 40 110 L 41 107 L 48 109 Z" fill="#ef4444"/>
  </g>
</svg>
